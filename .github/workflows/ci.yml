name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r collector/requirements.txt -r agent/requirements.txt -r experiments/requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
