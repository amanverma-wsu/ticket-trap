services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    env_file: [.env]
    volumes: ["./data:/app/data"]

  collector:
    build: ./collector
    command: python collector.py
    ports: ["127.0.0.1:9100:9100"]
    env_file: [.env]
    volumes: ["./data:/app/data"]

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    ports: ["127.0.0.1:5173:5173"]
