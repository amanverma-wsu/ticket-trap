
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    environment:
      TICKETTRAP_DB: /app/data/tickettrap.db
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    command: uvicorn collector.collector:app --host 0.0.0.0 --port 9100
    ports: ["127.0.0.1:9100:9100"]
    environment:
      TICKETTRAP_COLLECTOR_LOG: /app/data/logs/collector.jsonl
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
